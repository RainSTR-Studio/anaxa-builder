[package]
name = "anaxa-builder"
description = "A modern native Rust configuration management system"
version = "0.4.1"
edition = "2021"
authors = [
    "<moyan> <me@moyanjdc.top>",
    "<zhangxuan2011> <zx20110412@outlook.com>",
]
license = "MIT"
repository = "https://github.com/RainSTR-Studio/anaxa-builder"
categories = ["development-tools", "config", "development-tools::build-utils"]
readme = "../README.md"

[dependencies]
anyhow = "1.0.100"
evalexpr = "13.1.0"
petgraph = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "0.9.11"
walkdir = "2.5.0"
regex = "1.11.1"

[dev-dependencies]
tempfile = "3.24.0"
